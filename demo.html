<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Tra cứu Lịch Âm - Dương Việt Nam (lunar-vietnamese)</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        padding: 40px;
        line-height: 1.6;
      }
      .card {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        backdrop-filter: blur(10px);
      }
      h1 {
        color: #38bdf8;
        margin-top: 0;
      }
      h2 {
        color: #fbbf24;
        margin-top: 0;
        font-size: 1.25rem;
      }
      .meta {
        color: #94a3b8;
        font-size: 0.9rem;
      }
      .output {
        color: #e2e8f0;
        font-size: 1rem;
        margin-top: 8px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Lịch Âm - Dương Việt Nam (lunar-vietnamese)</h1>
    <p class="meta">
      Phát triển và duy trì bởi <strong>congtruongwr</strong> trên nhánh
      <code>main</code>
    </p>

    <div class="card">
      <h2>1. Ngày hiện tại (Hôm nay)</h2>
      <div id="today-lunar" class="output"></div>
      <div
        id="today-solar"
        class="output"
        style="color: #38bdf8; margin-top: 10px"
      ></div>
    </div>

    <div class="card">
      <h2>2. Tra cứu ngày chỉ định (Ví dụ: Tết 2026 Bính Ngọ)</h2>
      <div id="sample-lunar" class="output"></div>
      <div
        id="sample-solar"
        class="output"
        style="color: #38bdf8; margin-top: 10px"
      ></div>
    </div>

    <script src="lunar.js"></script>
    <script>
      // 1. Hôm nay
      var today = Lunar.fromDate(new Date());
      document.getElementById("today-lunar").innerHTML =
        "<strong>Âm lịch:</strong> " + today.toFullString();
      document.getElementById("today-solar").innerHTML =
        "<strong>Dương lịch:</strong> " + today.getSolar().toFullString();

      // 2. Tra cứu ngày chỉ định (1986-05-29)
      var sample = Lunar.fromYmd(1986, 4, 21);
      document.getElementById("sample-lunar").innerHTML =
        "<strong>Âm lịch:</strong> " + sample.toFullString();
      document.getElementById("sample-solar").innerHTML =
        "<strong>Dương lịch:</strong> " + sample.getSolar().toFullString();
    </script>
  </body>
</html>
